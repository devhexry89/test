
name: Build Aurora Chat Tags

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraChatTags-Fabric-26.3
          path: build/libs/*.jar
